version: 2

models:
  - name: stg_financial_service_production_base_view
    description: "Staging model cleaning and standardizing raw production financial transactions. Acts as the 1:1 base layer for downstream analytics and reporting marts."
    columns:
      - name: txn_row_id
        description: "Unique row identifier from the raw source system (Primary Key for staging)."
        tests:
          - unique
          - not_null

      - name: sequence_number
        description: "Transaction sequence number tracking log order."

      - name: approval_timestamp
        description: "Converted proper PostgreSQL timestamp of when the transaction was approved."
        tests:
          - not_null

      - name: txn_date
        description: "Extracted date component from approval timestamp used for partitioning and daily aggregations."
        tests:
          - not_null

      - name: txn_id
        description: "Core transaction identifier generated by the financial switch."
        tests:
          - not_null

      - name: response_code
        description: "System response code indicating the processing result (e.g., 00 for success)."

      - name: status
        description: "Operational status of the transaction (e.g., SUCCESS, FAILED, PENDING)."
        tests:
          - not_null

      - name: txn_type
        description: "Specific transaction type classification (e.g., Cash-In, Cash-Out, Send Money, Merchant Payment)."

      - name: processing_code
        description: "System processing code defining transaction routing and behavior."

      - name: debit_credit_indicator
        description: "Indicator specifying whether the transaction record is a debit ('D') or credit ('C')."
        tests:
          - accepted_values:
              values: ['D', 'C']

      - name: txn_category
        description: "Broad categorization of the transaction workflow."

      - name: channel_id
        description: "Client execution channel (e.g., USSD, App, USSD-Agent)."

      - name: from_id
        description: "Wallet ID or identifier initiating the transaction."

      - name: target_id
        description: "Wallet ID or identifier receiving the transaction."

      - name: txn_amt
        description: "Monetary transaction amount in local currency (BDT)."
        tests:
          - not_null

      - name: from_trust_level
        description: "Trust verification tier associated with the sender's account."

      - name: target_trust_level
        description: "Trust verification tier associated with the target's account."