version: 2

models:
  - name: agent_txn_data_mart
    description: "Incremental core data mart capturing daily customer cash-withdrawals processed by agents, enriched with service fees, agent commissions, and distributor house hierarchy mapping."
    columns:
      - name: approval_timestamp
        description: "Exact timestamp of transaction approval."
        tests:
          - not_null

      - name: txn_date
        description: "Date of the transaction used for partitioning and daily aggregation slices."
        tests:
          - not_null

      - name: txn_id
        description: "Unique transaction identifier generated by the core switch (Primary Key for incremental updates)."
        tests:
          - unique
          - not_null

      - name: txn_type
        description: "Classified transaction type label (e.g., 'cash withdraw')."
        tests:
          - not_null

      - name: agent_wallet
        description: "Wallet account identifier associated with the participating agent."

      - name: agent_name
        description: "Registered name of the agent."

      - name: dso_wallet
        description: "Wallet identifier of the assigned Distribution Sales Officer."

      - name: dh_wallet
        description: "Wallet identifier of the Distributor House."
        tests:
          - not_null

      - name: dh_name
        description: "Business name of the Distributor House."
        tests:
          - not_null

      - name: region_name
        description: "Geographical region name of the Distributor House."
        tests:
          - not_null
          - accepted_values:
              values: ['Dhaka', 'Chittagong', 'Sylhet', 'Rajshahi', 'Khulna', 'Barisal', 'Rangpur']

      - name: agent_id
        description: "Internal identifier of the agent casting text format."
        tests:
          - not_null

      - name: customer_id
        description: "Internal identifier of the customer initiating the cash withdrawal."
        tests:
          - not_null

      - name: txn_amt
        description: "Total transaction monetary amount for the cash withdrawal in local currency (BDT)."
        tests:
          - not_null

      - name: service_fee
        description: "Calculated service fee associated with the transaction (defaults to 0 if absent)."
        tests:
          - not_null

      - name: agent_commission
        description: "Calculated commission earned by the agent for the transaction (defaults to 0 if absent)."
        tests:
          - not_null